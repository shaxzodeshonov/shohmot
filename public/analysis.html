<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis board · Shohmot</title>
  <meta name="description" content="Play out any position and see Stockfish's best moves as you go, with variations, PGN and FEN.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="review/review.css">
  <link rel="stylesheet" href="review/analysis-board.css">
</head>
<body class="rv-page">
  <header class="bar rv-bar">
    <a class="wordmark" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8l-1-3.5c1.8-1.2 2.8-3.2 2.4-5.6-.4-2-1.8-3.4-3.4-4l.9-1.9-2-1-.8 1.6C9.6 6.8 7.5 8.9 7.5 11.7c0 1.4.6 2.7 1.6 3.6l-1.6 1 1 1.6 1.8-1L8 21z" fill="currentColor"/></svg>
      Shohmot
    </a>
    <div class="bar-actions">
      <button class="icon-btn" id="sound" type="button" aria-pressed="true" aria-label="Move sounds">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2-3.7v7.4a4.5 4.5 0 0 0 2-3.7zM14.5 4.3v2.1a7 7 0 0 1 0 11.2v2.1a9 9 0 0 0 0-15.4z" fill="currentColor"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z" fill="currentColor"/></svg>
      </button>
      <label class="depth">
        <span>Engine</span>
        <select id="engine">
          <option value="full">Stockfish 19</option>
          <option value="lite">Stockfish 19 lite</option>
        </select>
      </label>
      <a class="btn" href="/">Back to games</a>
    </div>
  </header>

  <main class="review">
    <section class="rv-board" aria-label="Board">
      <div class="stage">
        <div class="player top" id="player-top"></div>
        <div class="board-row">
          <div class="evalbar" id="evalbar" aria-hidden="true"><i></i><span></span></div>
          <div class="cb" id="board" role="img"></div>
        </div>
        <div class="player bottom" id="player-bottom"></div>
      </div>
    </section>

    <aside class="panel" aria-label="Analysis">
      <header class="panel-head">
        <h1 class="rv-title">Analysis</h1>
        <p class="rv-meta" id="opening">Starting position</p>
      </header>

      <div class="panel-game">
        <section class="lines" id="lines" aria-label="Engine lines" aria-live="off">
          <div class="lines-h">
            <button type="button" class="switch" id="live-toggle" aria-pressed="true"><i></i><span>Engine</span></button>
            <small id="lines-depth"></small>
          </div>
          <div class="lines-body" id="lines-body"></div>
        </section>

        <!-- Simulate a game: Stockfish plays on from the board, against itself or you. -->
        <section class="sim" id="sim" aria-labelledby="sim-h" hidden>
          <div class="sim-h">
            <h2 id="sim-h">Simulate a game</h2>
            <button type="button" class="sim-x" id="sim-close" aria-label="Close simulation" title="Back to analysis">×</button>
          </div>
          <div class="sim-sides">
            <div class="sim-side">
              <span class="sim-who"><span class="pl-dot w"></span>White</span>
              <div class="seg" role="group" aria-label="Who plays White" data-side="w">
                <button type="button" data-v="you">You</button>
                <button type="button" data-v="engine">Stockfish</button>
              </div>
            </div>
            <div class="sim-side">
              <span class="sim-who"><span class="pl-dot b"></span>Black</span>
              <div class="seg" role="group" aria-label="Who plays Black" data-side="b">
                <button type="button" data-v="you">You</button>
                <button type="button" data-v="engine">Stockfish</button>
              </div>
            </div>
          </div>
          <div class="sim-opts">
            <label>
              <span>Strength</span>
              <select id="sim-level">
                <option value="0">Beginner</option>
                <option value="1">Casual</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
                <option value="4">Expert</option>
                <option value="5">Maximum</option>
              </select>
            </label>
            <label id="sim-speed-wrap">
              <span>Speed</span>
              <select id="sim-speed">
                <option value="slow">Slow</option>
                <option value="normal">Normal</option>
                <option value="fast">Fast</option>
              </select>
            </label>
          </div>
          <p class="sim-status" id="sim-status" aria-live="polite"></p>
          <div class="sim-actions">
            <button type="button" class="btn btn-solid sim-go" id="sim-go"></button>
            <button type="button" class="btn" id="sim-undo" title="Take back your last move and Stockfish's reply">Take back</button>
          </div>
        </section>

        <div class="panel-body">
          <div class="tree" id="tree" aria-label="Moves"></div>
        </div>

        <div class="controls">
          <button class="nav" data-go="start" type="button" aria-label="First move" title="First move (Home)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nav" data-go="prev" type="button" aria-label="Previous move" title="Previous move (←)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nav" data-go="next" type="button" aria-label="Next move" title="Next move (→)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nav" data-go="end" type="button" aria-label="Last move" title="Last move (End)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nav" id="flip" type="button" aria-label="Flip the board" title="Flip the board (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="tools">
          <button class="btn btn-solid sim-open" id="sim-open" type="button" title="Let Stockfish play on from here, against itself or against you">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
            Simulate game
          </button>
          <button class="btn" id="new" type="button" title="Clear the board back to the starting position">New</button>
          <button class="btn" id="load" type="button" title="Paste a PGN or FEN">Load PGN / FEN</button>
          <button class="btn" id="copy-pgn" type="button">Copy PGN</button>
          <button class="btn" id="copy-fen" type="button">Copy FEN</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-act="promote">Make main line</button>
    <button type="button" role="menuitem" data-act="cut">Delete from here</button>
  </div>

  <dialog class="load" id="load-dialog" aria-labelledby="load-h">
    <form method="dialog" id="load-form">
      <h2 id="load-h">Load a position or game</h2>
      <p class="muted">Paste a PGN (variations are kept) or a FEN.</p>
      <textarea id="load-text" rows="8" spellcheck="false" autocomplete="off"></textarea>
      <p class="rv-error" id="load-error" role="alert" hidden></p>
      <div class="load-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-solid" id="load-go" value="load">Load</button>
      </div>
    </form>
  </dialog>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <script type="module" src="review/analysis-board.mjs"></script>
</body>
</html>
