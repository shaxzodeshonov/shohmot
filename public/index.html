<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shohmot</title>
  <meta name="description" content="Today's games on each Chess.com and Lichess account: how many of each type you played, and how many you lost.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8l-1-3.5c1.8-1.2 2.8-3.2 2.4-5.6-.4-2-1.8-3.4-3.4-4l.9-1.9-2-1-.8 1.6C9.6 6.8 7.5 8.9 7.5 11.7c0 1.4.6 2.7 1.6 3.6l-1.6 1 1 1.6 1.8-1L8 21z" fill="currentColor"/></svg>
      Shohmot
    </a>
    <div class="bar-actions">
      <p class="status" id="status" aria-live="polite"><span class="status-dot"></span><span id="status-text">Connecting</span></p>
      <button class="btn" id="sync-now" type="button">Sync now</button>
      <button class="btn" id="open-accounts" type="button">Accounts</button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="headline">
      <div class="day-nav">
        <button class="step" id="day-prev" type="button" aria-label="Previous day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="day-label" id="day-label">Today</p>
        <button class="step" id="day-next" type="button" aria-label="Next day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="link-btn" id="day-today" type="button" hidden>Back to today</button>
      </div>
      <h1 class="headline" id="headline">Counting your games…</h1>
      <div class="split" id="split" aria-hidden="true"></div>
      <p class="hero-sub" id="hero-sub"></p>
    </section>

    <section class="block" aria-labelledby="accounts-title">
      <div class="block-head">
        <h2 id="accounts-title">By account</h2>
        <label class="check"><input type="checkbox" id="rated-only"> Rated games only</label>
      </div>
      <div class="grid-head" id="grid-head" aria-hidden="true"></div>
      <div id="rows"></div>
    </section>

    <div class="lower">
      <section class="block" aria-labelledby="games-title">
        <div class="block-head">
          <h2 id="games-title">Games today</h2>
          <div class="toggle" role="group" aria-label="Which games" id="games-filter">
            <button type="button" data-r="all" aria-pressed="true">All</button>
            <button type="button" data-r="loss" aria-pressed="false">Losses</button>
          </div>
        </div>
        <ol class="games" id="games"></ol>
      </section>

      <section class="block" aria-labelledby="board-title">
        <div class="block-head">
          <h2 id="board-title">Last 26 weeks</h2>
        </div>
        <div class="board-wrap"><div class="board" id="board"></div></div>
        <p class="hint" id="board-hint"></p>
      </section>
    </div>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="sheet" id="accounts-dialog" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Your accounts</h2>
      <button class="btn" type="button" data-close>Done</button>
    </div>
    <ul class="sheet-list" id="sheet-list"></ul>
    <form class="add-form" id="add-form">
      <h3>Add an account</h3>
      <div class="add-row">
        <label class="field">
          <span>Site</span>
          <select name="platform">
            <option value="chesscom">Chess.com</option>
            <option value="lichess">Lichess</option>
          </select>
        </label>
        <label class="field grow">
          <span>Username</span>
          <input name="username" autocomplete="off" spellcheck="false" required minlength="2" maxlength="30" pattern="[A-Za-z0-9_\-]+">
        </label>
        <button class="btn btn-solid" type="submit">Add account</button>
      </div>
      <p class="form-error" id="add-error" role="alert"></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
